<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Details</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

.header{
    background:white;
    padding:20px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

.logo{
    width:240px;
    max-width:90%;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:20px;
    text-align:center;
}

.verified{
    font-size:20px;
    font-weight:bold;
    margin-bottom:25px;
    color:#222;
}

.qr{
    width:220px;
    height:220px;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
    padding:10px;
    object-fit:contain;
}

.details{
    margin-top:25px;
    line-height:2.2;
    font-size:20px;
    background:white;
    padding:20px;
    border-radius:10px;
}

.detail-row{
    margin-bottom:8px;
}

.label{
    font-weight:bold;
}

.copy-btn{
    padding:7px 14px;
    background:#004b93;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-left:8px;
}

.copy-btn:hover{
    opacity:0.9;
}

.pay-btn{
    width:320px;
    max-width:100%;
    padding:15px;
    margin-top:25px;
    border:none;
    border-radius:6px;
    background:#3cc5f3;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.back-btn{
    width:320px;
    max-width:100%;
    padding:15px;
    margin-top:15px;
    border:2px solid #3c9ef9;
    border-radius:6px;
    background:white;
    color:#3699f5;
    font-size:20px;
    cursor:pointer;
}

.loading{
    font-size:18px;
    margin-top:20px;
    color:#555;
}

.error{
    color:red;
    font-size:18px;
    margin-top:20px;
}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <img
        src="logo.png"
        class="logo"
        alt="Mudra Loan"
    >

</div>


<!-- MAIN -->

<div class="container">


    <div class="verified">
        ✔ Verified Business: Mudra Loan
    </div>


    <div
        id="loading"
        class="loading"
    >
        Loading Loan Details...
    </div>


    <!-- DETAILS -->

    <div
        class="details"
        id="detailsBox"
        style="display:none;"
    >


        <div class="detail-row">

            <span class="label">
                Customer:
            </span>

            <span id="customerName">
            </span>

        </div>


        <div class="detail-row">

            <span class="label">
                PAN Number:
            </span>

            <span id="PanNumber">
            </span>

        </div>


        <div class="detail-row">

            <span class="label">
                Loan Number:
            </span>

            <span id="LoanNumber">
            </span>

        </div>


        <div class="detail-row">

            <span class="label">
                Amount:
            </span>

            ₹<span id="amount">
            </span>

        </div>


        <div class="detail-row">

            <span class="label">
                UPI ID:
            </span>

            <span id="upiId">
            </span>

            <button
                class="copy-btn"
                type="button"
                onclick="copyUPI()"
            >
                Copy
            </button>

        </div>


        <div class="detail-row">

            <span class="label">
                Date:
            </span>

            <span id="loanDate">
            </span>

        </div>


    </div>


    <!-- PAYMENT AREA -->

    <button
        class="pay-btn"
        type="button"
        onclick="showPaymentMessage()"
    >
        Pay Now
    </button>


    <br>


    <!-- BACK -->

    <button
        class="back-btn"
        type="button"
        onclick="goBack()"
    >
        Back
    </button>


</div>


<!-- FIREBASE SCRIPT -->

<script type="module">

import {
    db,
    doc,
    getDoc
} from "./firebase.js";


/* ================================
   GET LOAN NUMBER FROM URL
================================ */

const params =
    new URLSearchParams(
        window.location.search
    );


const loan =
    params.get("loan");


/* ================================
   CHECK LOAN NUMBER
================================ */

if(!loan){

    alert("Loan number is missing from the link");

    window.location.href =
        "index.html";

}


/* ================================
   FETCH LOAN DATA
================================ */

try{


    console.log(
        "Fetching loan:",
        loan
    );


    const loanRef =
        doc(
            db,
            "loans",
            loan
        );


    const loanSnap =
        await getDoc(
            loanRef
        );


    /* ================================
       DOCUMENT NOT FOUND
    ================================ */

    if(!loanSnap.exists()){

        document.getElementById(
            "loading"
        ).innerText =
            "Loan details not found.";

        throw new Error(
            "Loan document does not exist."
        );

    }


    /* ================================
       GET FIREBASE DATA
    ================================ */

    const data =
        loanSnap.data();


    console.log(
        "Loan data:",
        data
    );


    /* ================================
       CUSTOMER
    ================================ */

    document.getElementById(
        "customerName"
    ).innerText =
        data.customer || "N/A";


    /* ================================
       PAN
    ================================ */

    document.getElementById(
        "PanNumber"
    ).innerText =
        data.panNumber || "N/A";


    /* ================================
       LOAN NUMBER
    ================================ */

    document.getElementById(
        "LoanNumber"
    ).innerText =
        data.loanNumber || loan;


    /* ================================
       AMOUNT
    ================================ */

    document.getElementById(
        "amount"
    ).innerText =
        data.amount || "0";


    /* ================================
       UPI
    ================================ */

    document.getElementById(
        "upiId"
    ).innerText =
        data.upi || "N/A";


    /* ================================
       DATE
    ================================ */

    const dateElement =
        document.getElementById(
            "loanDate"
        );


    if(data.date){

        /*
         If Firebase date is a Timestamp
        */

        if(
            typeof data.date.toDate ===
            "function"
        ){

            dateElement.innerText =
                data.date
                    .toDate()
                    .toLocaleDateString(
                        "en-IN"
                    );

        }

        /*
         If date is a normal string
        */

        else{

            dateElement.innerText =
                data.date;

        }

    }

    else{

        dateElement.innerText =
            "Date not available";

    }


    /* ================================
       SHOW DETAILS
    ================================ */

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "detailsBox"
    ).style.display =
        "block";


}


/* ================================
   ERROR
================================ */

catch(error){

    console.error(
        "Firebase Error:",
        error
    );


    document.getElementById(
        "loading"
    ).innerText =
        "Unable to fetch loan details.";


}


/* ================================
   COPY UPI
================================ */

window.copyUPI =
function(){

    const upi =
        document.getElementById(
            "upiId"
        ).innerText;


    if(
        !upi ||
        upi === "N/A"
    ){

        alert(
            "UPI ID is not available"
        );

        return;

    }


    navigator.clipboard
        .writeText(upi)
        .then(function(){

            alert(
                "UPI ID Copied"
            );

        })
        .catch(function(){

            alert(
                "Unable to copy UPI ID"
            );

        });

};


/* ================================
   PAY BUTTON
================================ */

window.showPaymentMessage =
function(){

    alert(
        "Payment processing is not configured on this page."
    );

};


/* ================================
   BACK BUTTON
================================ */

window.goBack =
function(){

    window.location.href =
        "admin.html";

};

</script>


</body>

</html>
