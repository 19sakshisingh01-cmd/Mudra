<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mudra Loan</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:30px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.logo{
    width:220px;
    display:block;
    margin:0 auto 20px auto;
}

h2{
    text-align:center;
    color:#004b93;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:5px;
    background:#34c4ef;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

</style>

</head>


<body>


<div class="container">

<img src="logo.png" class="logo">


<h2>Mudra Loan</h2>


<!-- Loan Number -->

<label for="LoanNumber">
    Loan Number
</label>

<input
    type="text"
    id="LoanNumber"
    maxlength="9"
    placeholder="Enter Loan Number"
>


<!-- PAN Number -->

<label for="PanNumber">
    PAN Number
</label>

<input
    type="text"
    id="PanNumber"
    maxlength="10"
    placeholder="Enter PAN Number"
>


<!-- Customer -->

<label for="customer">
    Customer Name
</label>

<input
    type="text"
    id="customer"
    placeholder="Enter Customer Name"
>


<!-- Amount -->

<label for="amount">
    Amount
</label>

<input
    type="number"
    id="amount"
    placeholder="Enter Amount"
>


<!-- UPI -->

<label for="upi">
    UPI ID
</label>

<input
    type="text"
    id="upi"
    placeholder="Enter UPI ID"
>


<!-- Generate Button -->

<button
    id="generateBtn"
    type="button"
    onclick="generateLink()"
>
    Generate Loan Link
</button>


<!-- Generated Link -->

<label for="generatedLink">
    Generated Link
</label>

<input
    type="text"
    id="generatedLink"
    readonly
    placeholder="Generated link will appear here"
>


<!-- Copy Button -->

<button
    id="copyBtn"
    type="button"
    onclick="copyLink()"
>
    Copy Link
</button>


</div>


<script type="module">

import {
    db,
    doc,
    setDoc
} from "./firebase.js";



/* =========================
   GENERATE LOAN LINK
========================= */

window.generateLink = async function(){

    const btn =
        document.getElementById("generateBtn");


    /* Get values */

    const loan =
        document
        .getElementById("LoanNumber")
        .value
        .trim();


    const Pan =
        document
        .getElementById("PanNumber")
        .value
        .trim()
        .toUpperCase();


    const customer =
        document
        .getElementById("customer")
        .value
        .trim();


    const amount =
        document
        .getElementById("amount")
        .value
        .trim();


    const upi =
        document
        .getElementById("upi")
        .value
        .trim();


    /* =========================
       REQUIRED FIELD CHECK
    ========================= */

    if(
        !loan ||
        !Pan ||
        !customer ||
        !amount ||
        !upi
    ){

        alert("Please fill all fields");

        return;
    }


    /* =========================
       PAN CHECK
    ========================= */

    if(
        !/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(Pan)
    ){

        alert(
            "PAN Number must be in format ABCDE1234F"
        );

        return;
    }


    /* =========================
       AMOUNT CHECK
    ========================= */

    if(
        Number(amount) <= 0
    ){

        alert("Please enter a valid amount");

        return;
    }


    /* =========================
       BUTTON LOADING
    ========================= */

    btn.disabled = true;

    btn.innerText = "Generating...";


    try{


        /* =========================
           SAVE TO FIREBASE
        ========================= */

        await setDoc(

            doc(
                db,
                "loans",
                loan
            ),

            {

                loanNumber: loan,

                panNumber: Pan,

                customer: customer,

                amount: Number(amount),

                upi: upi

            }

        );


        /* =========================
           CREATE CUSTOMER LINK
        ========================= */

        const link =
            window.location.origin +
            "/admin.html?loan=" +
            encodeURIComponent(loan);


        /* =========================
           SHOW LINK
        ========================= */

        document
            .getElementById("generatedLink")
            .value = link;


        console.log(
            "Loan Link Generated Successfully"
        );


        alert(
            "Loan link generated successfully!"
        );


    }

    catch(error){

        console.error(
            "Firebase Error:",
            error
        );


        alert(
            "Error: " + error.message
        );

    }


    finally{

        /* Always restore button */

        btn.disabled = false;

        btn.innerText =
            "Generate Loan Link";

    }

};



/* =========================
   COPY LINK
========================= */

window.copyLink = async function(){

    const link =
        document
        .getElementById("generatedLink");


    if(!link.value){

        alert(
            "Generate link first"
        );

        return;
    }


    try{

        await navigator
            .clipboard
            .writeText(link.value);


        alert(
            "Link copied successfully!"
        );


    }

    catch(error){

        console.error(error);

        alert(
            "Unable to copy link"
        );

    }

};

</script>


</body>
</html>
