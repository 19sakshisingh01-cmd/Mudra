<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mudra loan</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:30px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.logo{
    width:220px;
}

h2{
    text-align:center;
    color:#004b93;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:5px;
    background:#34c4ef;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}
</style>
</head>

<body>

<div style="display:flex;justify-content:center;">
    <img src="logo.png" class="logo">
</div>

<div class="container">

<h2>Mudra Loan</h2>

<label>Loan Number</label>
<input type="text" id="LoanNumber" maxlength="9" placeholder="Enter Loan Number">

<label>Pan Number</label>
<input type="text" id="PanNumber" maxlength="10" placeholder="Enter Pan Number">

<label>Customer Name</label>
<input type="text" id="customer" placeholder="Enter Customer Name">

<label>Amount</label>
<input type="number" id="amount" placeholder="Enter Amount">

<label>UPI ID</label>
<input type="text" id="upi" placeholder="Enter UPI ID">

<button
    id="generateBtn"
    type="button"
    onclick="generateLink()"
>
    Generate Loan Link
</button>


<label for="generatedLink">
    Generated Link
</label>

<input
    type="text"
    id="generatedLink"
    readonly
    placeholder="Generated link will appear here"
>


<button
    type="button"
    onclick="copyLink()"
>
    Copy Link
</button>

</div>

<script type="module">

import {
db,
doc,
setDoc
} from "./firebase.js";

window.generateLink = async function(){

    const btn = document.getElementById("generateBtn");

btn.disabled = true;
btn.innerText = "Generating...";

    const loan =
    document.getElementById("LoanNumber").value.trim();

    const Pan =
    document.getElementById("PanNumber").value.trim().toUpperCase();

    const customer =
    document.getElementById("customer").value.trim();

    const amount =
    document.getElementById("amount").value.trim();

    const upi =
    document.getElementById("upi").value.trim();

    if(!loan || !Pan || !customer || !amount || !upi){
        alert("Please fill all fields");
        return;
    }

    if(!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(Pan)){
    alert("PAN Number must be in format ABCDE1234F");
    return;
}
    }

    try{

        await setDoc(
            doc(db,"loans",loan),
            {
    LoanNumber: loan,
    panNumber: Pan,
    customer: customer,
    amount: Number(amount),
    upi: upi
}

        );

         // Generate link
        const link =
            window.location.origin +
            "/index.html?loan=" +
            encodeURIComponent(loan);


        document.getElementById(
            "generatedLink"
        ).value = link;


        btn.disabled = false;
        btn.innerText = "Generate Loan Link";


        console.log("Loan Link Generated Successfully");


    } catch (error) {
         const btn = document.getElementById("generateBtn");

        btn.disabled = false;
        btn.innerText = "Generate Loan Link";

        console.error(error);

        alert(error.message);
    }
    };

window.copyLink = function () {

    const link =
        document.getElementById("generatedLink");


    if (!link.value) {

        alert("Generate link first");

        return;
    }


    navigator.clipboard.writeText(link.value);

    alert("Link Copied Successfully");

};



</script>

</body>
</html>
